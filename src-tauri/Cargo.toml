[package]
name = "grokzilla"
version = "0.5.0"
description = "Desktop GUI for Grok Build CLI"
authors = ["Anh Nguyen"]
edition = "2021"
default-run = "grokzilla"

[lib]
name = "grokzilla_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
ignore = "0.4"
portable-pty = "0.9"
base64 = "0.22"
libc = "0.2"

[[bin]]
name = "grokzilla"
path = "src/main.rs"

[[bin]]
name = "grokzilla-ctl"
path = "src/bin/grokzilla_ctl.rs"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
